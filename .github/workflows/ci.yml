name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airdrop
          POSTGRES_PASSWORD: airdrop
          POSTGRES_DB: airdrop_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airdrop -d airdrop_engine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://airdrop:airdrop@localhost:5432/airdrop_engine_test
      TEST_DATABASE_URL: postgresql+psycopg://airdrop:airdrop@localhost:5432/airdrop_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest
